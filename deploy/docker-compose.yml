# Noafar on a single VPS: Caddy (HTTPS) -> app (Node) -> db (Postgres).
# Written for compose file format 3.x so it also runs on the older
# `docker-compose` that Ubuntu 20.04 ships.
version: "3.8"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: noafar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: noafar
    volumes:
      - dbdata:/var/lib/postgresql/data
    # No published port: the database is reachable only from the app container.

  app:
    build:
      context: ..
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://noafar:${POSTGRES_PASSWORD}@db:5432/noafar
    depends_on:
      - db
    volumes:
      - uploads:/app/uploads
    # Reached through Caddy only.
    expose:
      - "4000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      - app

volumes:
  dbdata:
  uploads:
  caddydata:
  caddyconfig:
